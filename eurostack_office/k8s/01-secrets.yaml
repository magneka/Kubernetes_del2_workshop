# =============================================================================
# 01 - SECRETS
# =============================================================================
# A Secret holds sensitive values (passwords, keys). Pods read them as
# environment variables or files, so passwords never have to be written into
# the Deployment files themselves.
#
# IMPORTANT FOR THE TUTORIAL:
#   * Secrets are only base64-encoded, NOT encrypted. Anyone who can run
#     "kubectl get secret -o yaml" can read them.
#   * The values below are tutorial placeholders. Change them, and never
#     commit real passwords to git.
#   * "stringData" lets us write plain text. Kubernetes base64-encodes it
#     for us and stores it under "data".
#
# Generate good random values with, for example:
#   openssl rand -hex 32
# =============================================================================

# --- Secret 1: PostgreSQL database credentials ------------------------------
# Used by BOTH the database (05) and Nextcloud (08), so they agree on the
# same user and password.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: eurostack
type: Opaque                      # "Opaque" = generic key/value secret.
stringData:
  POSTGRES_DB: nextcloud          # Database name to create.
  POSTGRES_USER: nextcloud        # Database user to create.
  POSTGRES_PASSWORD: change-me-db-password

---
# Three dashes (---) separate several objects inside one YAML file.

# --- Secret 2: Nextcloud administrator account ------------------------------
# The first admin user, created automatically on the first start.
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-admin
  namespace: eurostack
type: Opaque
stringData:
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: change-me-admin-password

---
# --- Secret 3: Euro-Office JWT secret ---------------------------------------
# Euro-Office and Nextcloud sign their messages to each other with a JSON
# Web Token (JWT). Both sides MUST use the exact same value, otherwise the
# editor shows a "document security token" error. Use at least 32 characters.
# Read by Euro-Office (06) and by the Nextcloud setup script (02 and 08).
apiVersion: v1
kind: Secret
metadata:
  name: euro-office-jwt
  namespace: eurostack
type: Opaque
stringData:
  JWT_SECRET: change-me-to-a-long-random-string-of-32-plus-chars
