name: k8sexp-debug

services:
  mysql:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.debug
    # Interactive: the container idles; attach VS Code and run/debug the API from inside it.
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    volumes:
      - ./api/src:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8082:8080"   # host 8082: 8080 is used by eurostack_office (Nextcloud)
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY: http://api:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mysql-data:
  go-mod-cache:
